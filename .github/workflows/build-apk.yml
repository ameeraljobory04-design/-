name: Build APK (الملازم)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Collect the app files into www/
        run: |
          mkdir -p www
          cp index.html books.json manifest.webmanifest sw.js www/
          cp -r icons vendor books www/

      - name: Install Capacitor
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/android@7.4.0 sharp@0.33.5

      - name: Create the Android project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.almalazim.app",
            "appName": "الملازم",
            "webDir": "www",
            "android": { "backgroundColor": "#1b0fb4" }
          }
          EOF
          npx cap add android

      - name: Use the pear icon as the app icon
        run: |
          cat > make-icons.cjs <<'EOF'
          const sharp = require("sharp");
          const fs = require("fs");
          const res = "android/app/src/main/res";
          fs.rmSync(res + "/mipmap-anydpi-v26", { recursive: true, force: true });
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [d, s] of Object.entries(sizes)) {
              const dir = `${res}/mipmap-${d}`;
              fs.mkdirSync(dir, { recursive: true });
              fs.rmSync(`${dir}/ic_launcher_foreground.png`, { force: true });
              for (const name of ["ic_launcher.png", "ic_launcher_round.png"]) {
                await sharp("icons/icon-512.png").resize(s, s).png().toFile(`${dir}/${name}`);
              }
            }
            console.log("icons done");
          })();
          EOF
          node make-icons.cjs

      - name: Build the APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: almalazim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
